<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>وصل | لوحة التحكم</title><body data-admin="{{ 'true' if admin else 'false' }}" data-role="{{ user.role }}"><aside><div class="brand">وصل <small>إدارة التواصل</small></div><p class="muted">{{ 'إدارة المنصة' if admin else 'مساحة العمل' }}</p><nav id="nav"></nav><footer><strong>{{ user.name }}</strong><p>{{ user.role }}</p><button id="logout" class="secondary">تسجيل الخروج</button></footer></aside><main class="workspace"><header><div><small>مساحة العمل / <span id="crumb">الرئيسية</span></small><h1 id="title">لوحة التحكم</h1></div><span class="badge">{{ user.role }}</span></header><p id="notice" role="status"></p><section id="content"></section></main><dialog id="dialog"><button id="close" class="secondary">إغلاق</button><p id="dialog-notice" role="status"></p><section id="detail"></section></dialog><script src="/static/app.js"></script></body></html>
